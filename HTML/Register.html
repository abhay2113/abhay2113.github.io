<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../images/logo/fevicon.png">
    <title>Register | MarineCourse</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body class="auth-page">

    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-logo">
                Marine<span>Course</span>
            </div>

            <h1>Create Account</h1>

            <form id="registerForm" class="auth-form">
                <input class="auth-input" type="text" id="name" placeholder="Full Name" required>
                <input class="auth-input" type="email" id="email" placeholder="Email Address" required>
                <input class="auth-input" type="password" id="password" placeholder="Password" minlength="8" required>
                <button class="auth-action" type="submit">Create Account</button>
            </form>

            <div id="message" class="auth-message"></div>

            <div class="auth-link-row">
                Already have an account?
                <a href="Login.html">Login</a>
            </div>
        </div>
    </div>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function(e) {

                e.preventDefault();

                const name =
                    document.getElementById("name").value;

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                try {

                    const response = await fetch(
                        "/api/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name,
                                email,
                                password
                            })
                        }
                    );

                    const data = await response.json();

                    message.textContent = data.message;

                    if (data.success) {

                        message.style.color = "#19d3f3";

                        setTimeout(() => {
                            window.location.href =
                                "Login.html";
                        }, 1000);

                    } else {

                        message.style.color = "red";
                    }

                } catch (error) {

                    message.textContent =
                        "Server connection failed.";

                    message.style.color = "red";
                }

            });

    </script>

</body>
</html>
