<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../images/logo/fevicon.png">
    <title>AIIMT Courses Section</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="course-showcase-page">

    <div class="container">
        <!-- Section Header -->
        <div class="section-header">
            <p>WE OFFER</p>
            <h2>COURSES</h2>
        </div>

        <!-- Courses Grid Container -->
        <div class="courses-grid">
            
            <!-- Course Card 1 -->
            <a class="course-card-link" href="course-detail.html?course=tasco">
            <div class="course-card">
                <div class="card-img-container">
                    <!-- Aap yahan apni image ka path daal sakte hain -->
                    <img src="https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=600&q=80" alt="TASCO">
                    <div class="icon-badge">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                </div>
                <div class="card-content">
                    <h3>TASCO</h3>
                    <p>Advanced Training For Oil Tanker Cargo Operations</p>
                    <div class="card-footer">
                        <span class="duration"><i class="fa-regular fa-calendar"></i> 6 Days</span>
                        <span class="price">&#8377; 5500</span>
                    </div>
                </div>
            </div>
            </a>

            <!-- Course Card 2 -->
            <a class="course-card-link" href="course-detail.html?course=hv-m">
            <div class="course-card">
                <div class="card-img-container">
                    <img src="https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=600&q=80" alt="HV-(M)">
                    <div class="icon-badge">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                </div>
                <div class="card-content">
                    <h3>HV-(M)</h3>
                    <p>High Voltage Safety and Switch Gear</p>
                    <div class="card-footer">
                        <span class="duration"><i class="fa-regular fa-calendar"></i> 4 Days</span>
                        <span class="price">&#8377; 6000</span>
                    </div>
                </div>
            </div>
            </a>

            <!-- Course Card 3 -->
            <a class="course-card-link" href="course-detail.html?course=otcto">
            <div class="course-card">
                <div class="card-img-container">
                    <img src="https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=600&q=80" alt="OTCTO">
                    <div class="icon-badge">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                </div>
                <div class="card-content">
                    <h3>OTCTO</h3>
                    <p>Basic Oil Tanker and Chemical Tanker Operations</p>
                    <div class="card-footer">
                        <span class="duration"><i class="fa-regular fa-calendar"></i> 6 Days</span>
                        <span class="price">&#8377; 4500</span>
                    </div>
                </div>
            </div>
            </a>

        </div>
    </div>

</body>
</html>
