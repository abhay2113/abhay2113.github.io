<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIIMT Courses Section</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .section-header {
            margin-bottom: 40px;
        }

        .section-header p {
            font-size: 14px;
            letter-spacing: 2px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .section-header h2 {
            font-size: 32px;
            color: #222;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            text-align: left;
        }

        .course-card {
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .card-img-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .icon-badge {
            position: absolute;
            bottom: -20px;
            right: 20px;
            background-color: #0082cb;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 130, 203, 0.3);
            font-size: 18px;
        }

        .card-content {
            padding: 25px 20px 20px 20px;
        }

        .card-content h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .card-content p {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
            min-height: 42px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 15px;
            font-size: 13px;
            color: #777;
        }

        .card-footer .duration {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-footer .price {
            font-weight: 600;
            color: #333;
        }

        /* Responsive Design for smaller screens */
        @media (max-width: 768px) {
            .courses-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Section Header -->
        <div class="section-header">
            <p>WE OFFER</p>
            <h2>COURSES</h2>
        </div>

        <!-- Courses Grid Container -->
        <div class="courses-grid">
            
            <!-- Course Card 1 -->
            <div class="course-card">
                <div class="card-img-container">
                    <!-- Aap yahan apni image ka path daal sakte hain -->
                    <img src="https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=600&q=80" alt="TASCO">
                    <div class="icon-badge">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                </div>
                <div class="card-content">
                    <h3>TASCO</h3>
                    <p>Advanced Training For Oil Tanker Cargo Operations</p>
                    <div class="card-footer">
                        <span class="duration"><i class="fa-regular fa-calendar"></i> 6 Days</span>
                        <span class="price">&#8377; 5500</span>
                    </div>
                </div>
            </div>

            <!-- Course Card 2 -->
            <div class="course-card">
                <div class="card-img-container">
                    <img src="https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=600&q=80" alt="HV-(M)">
                    <div class="icon-badge">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                </div>
                <div class="card-content">
                    <h3>HV-(M)</h3>
                    <p>High Voltage Safety and Switch Gear</p>
                    <div class="card-footer">
                        <span class="duration"><i class="fa-regular fa-calendar"></i> 4 Days</span>
                        <span class="price">&#8377; 6000</span>
                    </div>
                </div>
            </div>

            <!-- Course Card 3 -->
            <div class="course-card">
                <div class="card-img-container">
                    <img src="https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=600&q=80" alt="OTCTO">
                    <div class="icon-badge">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                </div>
                <div class="card-content">
                    <h3>OTCTO</h3>
                    <p>Basic Oil Tanker and Chemical Tanker Operations</p>
                    <div class="card-footer">
                        <span class="duration"><i class="fa-regular fa-calendar"></i> 6 Days</span>
                        <span class="price">&#8377; 4500</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
