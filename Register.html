<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | GlobalMove</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #06121c;
            color: white;
        }

        .box {
            width: 380px;
            padding: 35px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 20px;
            background: rgba(255,255,255,.05);
            backdrop-filter: blur(15px);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .logo span {
            color: #19d3f3;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 10px;
            background: rgba(255,255,255,.08);
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #19d3f3;
            color: #06121c;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0fb6d4;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #19d3f3;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">
            Global<span>Move</span>
        </div>

        <h1>Create Account</h1>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                minlength="8"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <div id="message"></div>

        <div class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function(e) {

                e.preventDefault();

                const name =
                    document.getElementById("name").value;

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                try {

                    const response = await fetch(
                        "/api/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name,
                                email,
                                password
                            })
                        }
                    );

                    const data = await response.json();

                    message.textContent = data.message;

                    if (data.success) {

                        message.style.color = "#19d3f3";

                        setTimeout(() => {
                            window.location.href =
                                "login.html";
                        }, 1000);

                    } else {

                        message.style.color = "red";
                    }

                } catch (error) {

                    message.textContent =
                        "Server connection failed.";

                    message.style.color = "red";
                }

            });

    </script>

</body>
</html>
